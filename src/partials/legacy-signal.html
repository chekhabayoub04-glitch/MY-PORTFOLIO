<!-- ============ SIGNAL (contact) ============ -->
<section class="signal" id="signal" aria-labelledby="signalTitle">
  <div class="signal-beam" id="signalBeam" aria-hidden="true"></div>

  <div class="signal-inner">
    <div class="signal-copy">
      <h2 class="signal-title" id="signalTitle">Got a brand<br>hiding in<br>the <em>dark?</em></h2>
      <p class="lede">Light the signal. Landing page, logo, campaign or film, tell me the mission and I'll answer within a day.</p>

      <ul class="signal-lines">
        <li><a href="mailto:CHEKHABAYOUB04@GMAIL.COM" data-lens="Write"><i class="fas fa-envelope" aria-hidden="true"></i><span>CHEKHABAYOUB04@GMAIL.COM</span></a></li>
        <li><a href="tel:0658030536" data-lens="Call"><i class="fas fa-phone" aria-hidden="true"></i><span>0658 03 05 36</span></a></li>
        <li><a href="https://www.linkedin.com/in/ayoub-chekhab-152750257/" target="_blank" rel="noopener noreferrer" data-lens="Visit"><i class="fab fa-linkedin-in" aria-hidden="true"></i><span>LinkedIn</span></a></li>
      </ul>
    </div>

    <form class="signal-form" id="signalForm" aria-describedby="signalNote">
      <div class="field">
        <input id="fName" name="name" type="text" autocomplete="name" placeholder=" " required>
        <label for="fName">Your name</label>
      </div>
      <div class="field">
        <input id="fEmail" name="email" type="email" autocomplete="email" placeholder=" " required>
        <label for="fEmail">Your email</label>
      </div>
      <fieldset class="field-chips">
        <legend>The mission</legend>
        <label><input type="radio" name="subject" value="Web Experience" checked><span>Website</span></label>
        <label><input type="radio" name="subject" value="Brand Mark"><span>Logo</span></label>
        <label><input type="radio" name="subject" value="Campaign Visuals"><span>Campaign</span></label>
        <label><input type="radio" name="subject" value="AI Brand Film"><span>AI Film</span></label>
      </fieldset>
      <div class="field">
        <textarea id="fMessage" name="message" rows="4" placeholder=" " required></textarea>
        <label for="fMessage">Tell me about it</label>
      </div>
      <button class="signal-send" type="submit" data-lens="Send">
        <span>Send the signal</span>
        <svg class="bat" viewBox="0 0 200 100" aria-hidden="true"><use href="#bat"/></svg>
      </button>
      <p class="form-note" id="signalNote">Sending opens a prefilled message in your email app. Nothing is stored.</p>
    </form>
  </div>
</section>
