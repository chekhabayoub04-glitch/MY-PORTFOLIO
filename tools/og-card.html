<!DOCTYPE html>
<!-- Link-preview card (1200×630). Rendered to images/og-cover.jpg by tools/render_og.mjs -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@1&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #000; font-family: 'Outfit', sans-serif; color: #fff; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(520px 520px at 300px 330px, rgba(255, 205, 0, .95) 0%, rgba(255, 190, 0, .55) 38%, rgba(255, 170, 0, .12) 62%, transparent 72%),
      radial-gradient(900px 600px at 900px 300px, #15110a, #000 70%);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255, 215, 0, .12) 1.2px, transparent 1.6px); background-size: 10px 10px;
    -webkit-mask-image: linear-gradient(90deg, transparent 45%, #000 100%);
  }
  .me {
    position: absolute; left: -10px; bottom: -40px; width: 640px;
    filter: drop-shadow(0 0 2px rgba(255, 225, 100, .9)) drop-shadow(0 20px 40px rgba(0, 0, 0, .6));
  }
  .info { position: absolute; left: 610px; top: 62px; right: 60px; }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: #FFD700; }
  .kicker::before { content: ''; width: 34px; height: 2px; background: #FFD700; }
  h1 { margin-top: 18px; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 104px; line-height: .86; letter-spacing: .01em; }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 64px; color: #FFD700; display: block; margin-top: 8px; letter-spacing: 0; }
  ul { list-style: none; margin-top: 30px; display: grid; gap: 0; border-top: 1px solid rgba(255, 215, 0, .25); }
  li {
    display: flex; align-items: center; gap: 18px; padding: 11px 0; border-bottom: 1px solid rgba(255, 215, 0, .18);
    font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1;
  }
  li small { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; color: #FFD700; width: 26px; }
  .foot { position: absolute; left: 610px; right: 60px; bottom: 36px; display: flex; justify-content: space-between; font-size: 15px; color: rgba(255, 255, 255, .6); letter-spacing: .06em; }
  .foot b { color: #fff; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="dots"></div>
    <img class="me" src="../images/hero/ayoub-cutout.webp" alt="">
    <div class="info">
      <p class="kicker">Digital Creator · Algiers</p>
      <h1>Ayoub Chekhab<em>out of the shadow, into the light.</em></h1>
      <ul>
        <li><small>01</small>Web Experiences</li>
        <li><small>02</small>Campaign Visuals</li>
        <li><small>03</small>AI Brand Films</li>
        <li><small>04</small>Brand Marks</li>
      </ul>
    </div>
    <div class="foot"><span><b>Portfolio</b> · Websites · Design · Film</span><span>CHEKHABAYOUB11@GMAIL.COM</span></div>
  </div>
</body>
</html>
