<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Media — Ayoub Chekhab</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="service-header">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
    <h1>Social Media Management</h1>
  </header>

  <main class="service-main">
    <section class="hero-landing">
      <h2>Social Media Management</h2>
      <p>Placeholders for social graphics — fill later from <strong>images/</strong>.</p>
    </section>

    <section class="plain-gallery" id="socialGallery" aria-label="Social image slots"></section>
  </main>

  <footer class="service-footer">
    <a href="mailto:CHEKHABAYOUB04@GMAIL.COM">Request a Campaign</a>
  </footer>

  <script>
    // Edit `window.SOCIAL_SLOTS` below to set the filenames directly in code.
    // Example: { title: 'Image 1', image: 'images/my-image.jpg' }
    // Leave `image: ''` for an empty slot.
    window.SOCIAL_SLOTS = [
      { title: 'Image 1', image: 'images/april3.png' },
      { title: 'Image 2', image: 'images/april4.png' },
      { title: 'Image 3', image: 'images/april5.png' },
      { title: 'Image 4', image: 'images/aprilll.jpg' },
      { title: 'Image 5', image: 'images/april1.jpg' },
      { title: 'Image 6', image: 'images/april2.jpg' },
      { title: 'Image 7', image: 'images/lozan1.jpg' },
      { title: 'Image 8', image: 'images/loazan3.jpg' },
      { title: 'Image 9', image: 'images/rozan4.jpg' },
      { title: 'Image 10', image: 'images/rozan5.jpg' },
      { title: 'Image 11', image: 'images/rozan6.jpg' },
      { title: 'Image 12', image: 'images/rozan7.jpg' },
      { title: 'Image 13', image: 'images/rozan8.jpg' },
      { title: 'Image 14', image: 'images/rozan9.jpg' }
    ];

    /* Render vertical list: preview on left, title/filename on right */
    function refreshSocialGallery(){
      const g = document.getElementById('socialGallery'); if(!g) return; g.innerHTML = '';
      window.SOCIAL_SLOTS.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'social-card plain-image-card';
        card.setAttribute('data-idx', idx);
        if (s.image) {
          const img = document.createElement('img');
          img.src = s.image; img.alt = s.title || `Image ${idx+1}`;
          card.appendChild(img);
          img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover'; img.style.display = 'block';
          card.addEventListener('click', () => openLightboxForSlot(idx));
        } else {
          const empty = document.createElement('div'); empty.className = 'slot-image-empty'; empty.innerHTML = `<span>${s.title}</span>`; card.appendChild(empty);
        }
        g.appendChild(card);
      });
    }

    /* --- Lightbox for social gallery --- */
    function createSocialLightbox() {
      if (document.getElementById('socialLightbox')) return;
      const lb = document.createElement('div'); lb.id = 'socialLightbox'; lb.className = 'service-lightbox';
      lb.innerHTML = `
        <div class="lb-inner">
          <button class="lb-close">✕</button>
          <button class="lb-prev">‹</button>
          <div class="lb-stage"><img src="" alt=""></div>
          <button class="lb-next">›</button>
        </div>`;
      document.body.appendChild(lb);
      const img = lb.querySelector('.lb-stage img');
      let list = [];
      let idx = 0;

      function show(i){ if(!list.length) return; idx = (i + list.length) % list.length; img.src = list[idx]; lb.classList.add('open'); }
      lb.querySelector('.lb-close').onclick = ()=> lb.classList.remove('open');
      lb.querySelector('.lb-prev').onclick = ()=> show(idx-1);
      lb.querySelector('.lb-next').onclick = ()=> show(idx+1);
      lb.addEventListener('click', (e)=>{ if(e.target === lb) lb.classList.remove('open'); });

      // expose helper
      window._socialLightbox = {
        openFromSlot(slotIndex){
          // build list of image URLs from SOCIAL_SLOTS (only non-empty)
          list = window.SOCIAL_SLOTS.map(s => s.image).filter(Boolean);
          const targetUrl = window.SOCIAL_SLOTS[slotIndex].image;
          const start = list.indexOf(targetUrl);
          show(start >= 0 ? start : 0);
        }
      };
      // keyboard navigation and wheel (scoped to this lightbox)
      function onKey(e){ if(!lb.classList.contains('open')) return; if(e.key === 'ArrowLeft') show(idx-1); else if(e.key === 'ArrowRight') show(idx+1); else if(e.key === 'Escape') lb.classList.remove('open'); }
      function onWheel(e){ if(!lb.classList.contains('open')) return; if(e.deltaY > 0) show(idx+1); else if(e.deltaY < 0) show(idx-1); }
      document.addEventListener('keydown', onKey);
      lb.addEventListener('wheel', onWheel, {passive:true});
    }

    function openLightboxForSlot(slotIdx){ if(!window._socialLightbox) createSocialLightbox(); window._socialLightbox.openFromSlot(slotIdx); }

    document.addEventListener('DOMContentLoaded', ()=>{
      refreshSocialGallery();
    });
  </script>
  <style>
    body { cursor: auto !important; }

    .service-header h1,
    .hero-landing h2 {
      font-family: var(--font-body);
      font-weight: 800;
      letter-spacing: 0;
    }

    .service-main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 40px 30px 80px;
    }

    #socialGallery {
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:18px;
      margin-top:18px;
    }

    @media (max-width: 1100px) { #socialGallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { #socialGallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 420px) { #socialGallery { grid-template-columns: 1fr; } }

    .social-card { aspect-ratio: 1/1; overflow: hidden; border-radius: 12px; border: 1px solid rgba(255,215,0,.06); background: rgba(10,10,10,0.35); display:flex; align-items:center; justify-content:center; }
    .social-card img { width:100%; height:100%; display:block; object-fit:cover; }
    .social-card .slot-image-empty { padding:24px; }
  </style>
</body>
</html>
